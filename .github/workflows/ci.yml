name: duka_backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrations + test suite
    runs-on: ubuntu-latest
    env:
      # SQLite is enough: POSTGRES_DB is unset, so settings fall back to it.
      # CELERY_TASK_ALWAYS_EAGER runs tasks inline, so no broker is needed.
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fail on missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test -v 1

  build-and-push:
    name: Build and push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The server pulls this image; it never builds the app itself.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/duka_backend:latest
            ${{ secrets.DOCKER_USERNAME }}/duka_backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-production:
    name: Deploy to production
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            # Orchestration lives in the infra repo; app source is never cloned here.
            cd ~/twendedigital-infra
            git pull --ff-only
            cd apps/duka_backend

            # DB must be up before migrations/collectstatic run against it.
            docker compose up -d db redis
            docker compose pull api worker beat

            # One-off container: migrate once (not per-replica) and populate the
            # shared static volume before any api replica starts serving.
            docker compose run --rm --no-deps api sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"

            docker compose up -d
            docker compose ps

            # gunicorn needs a few seconds to bind; probe every replica.
            ok=0
            for attempt in $(seq 1 30); do
              ok=1
              for cid in $(docker compose ps -q api); do
                docker exec "$cid" python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)" >/dev/null 2>&1 || ok=0
              done
              [ "$ok" = "1" ] && echo "all api replicas healthy" && break
              sleep 3
            done
            [ "$ok" = "1" ]

            docker image prune -f
