name: duka_backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Migrations + test suite
    runs-on: ubuntu-latest
    env:
      # SQLite is enough: POSTGRES_DB is unset, so settings fall back to it.
      # CELERY_TASK_ALWAYS_EAGER runs tasks inline, so no broker is needed.
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fail on missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test -v 1

  deploy:
    name: Build, push and deploy
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build -t "$DOCKER_USERNAME/duka_backend:latest" .
          docker push "$DOCKER_USERNAME/duka_backend:latest"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script_stop: true
          script: |
            # The first deploy is manual (clone + .env); this step only updates
            # an existing checkout, and says so instead of failing the run.
            cd ~/duka_backend || { echo '~/duka_backend is not checked out yet - run the one-time setup in the README'; exit 0; }
            git pull --ff-only
            export BACKEND_IMAGE="${{ secrets.DOCKER_USERNAME }}/duka_backend:latest"
            docker compose -f docker-compose.prod.yml pull api worker beat
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml exec -T api python -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8000/healthz/',timeout=10).read().decode())"
            docker image prune -f
